<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>please wait</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --desktop:#008080;
  --face:#c0c0c0;
  --hi:#ffffff;
  --sh:#808080;
  --dk:#000000;
  --tb1:#0a0a8c;
  --tb2:#1084d0;
  --text:#000000;
  --green:#008000;
  --bsod:#0000aa;
  --ui:Tahoma,Verdana,'Segoe UI',Arial,sans-serif;
  --serif:'Instrument Serif',Georgia,serif;
  --mono:'Courier New',Consolas,monospace;
}
*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;min-height:100%;
  background:var(--desktop);
  font-family:var(--ui);
  overflow-x:hidden;
}
body{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  position:relative;
  padding:16px;
  padding-bottom:56px;
  cursor:default;
  user-select:none;
}

/* ---------- bevel helpers ---------- */
.raised{
  background:var(--face);
  border-top:1px solid var(--hi);
  border-left:1px solid var(--hi);
  border-right:1px solid var(--dk);
  border-bottom:1px solid var(--dk);
  box-shadow:inset 1px 1px 0 var(--face), inset -1px -1px 0 var(--sh);
}
.sunken{
  background:var(--hi);
  border-top:1px solid var(--sh);
  border-left:1px solid var(--sh);
  border-right:1px solid var(--hi);
  border-bottom:1px solid var(--hi);
  box-shadow:inset 1px 1px 0 var(--dk);
}

/* ---------- window ---------- */
.window{
  width:min(420px,92vw);
  display:flex;
  align-items:stretch;
  background:var(--face);
  border-top:2px solid var(--hi);
  border-left:2px solid var(--hi);
  border-right:2px solid var(--dk);
  border-bottom:2px solid var(--dk);
  box-shadow:inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 var(--sh), 4px 4px 12px rgba(0,0,0,.35);
  transition:transform .05s linear, width 1.2s cubic-bezier(.3,1.4,.5,1);
}
.window.extended{ width:min(860px, 94vw); }
.window.shake{ animation:shake .32s ease; }
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-4px);}
  40%{transform:translateX(4px);}
  60%{transform:translateX(-3px);}
  80%{transform:translateX(3px);}
}
@media (prefers-reduced-motion: reduce){
  .window.shake{ animation:none; }
}

.titlebar{
  background:linear-gradient(90deg,var(--tb1),var(--tb2));
  color:#fff;
  font-size:12px;
  font-weight:bold;
  padding:3px 3px 3px 6px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  letter-spacing:.2px;
}
.titlebar-btns{display:flex;gap:2px;}
.tbtn{
  width:16px;height:14px;
  background:var(--face);
  border-top:1px solid var(--hi);
  border-left:1px solid var(--hi);
  border-right:1px solid var(--dk);
  border-bottom:1px solid var(--dk);
  color:#000;
  font-size:9px;
  line-height:12px;
  text-align:center;
  cursor:pointer;
}
.tbtn:active{
  border-top:1px solid var(--dk);
  border-left:1px solid var(--dk);
  border-right:1px solid var(--hi);
  border-bottom:1px solid var(--hi);
}
.tbtn:focus-visible, .okbtn:focus-visible{
  outline:1px dotted #000;
  outline-offset:-3px;
}

.window-main{
  width:min(420px,92vw);
  flex:0 0 auto;
  min-width:0;
  display:flex;flex-direction:column;
}
.window-side{
  flex:1 1 auto;
  min-width:0;
  overflow:hidden;
  border-left:1px solid var(--sh);
  box-shadow:inset 1px 0 0 var(--hi);
  opacity:0;
  display:flex;flex-direction:column;
  transition:opacity .6s ease .35s;
}
.window.extended .window-side{ opacity:1; }
.window-side-head{
  font-size:11px;font-weight:bold;color:#000;
  padding:9px 10px 5px;
  white-space:nowrap;
}
.window-side-list{
  flex:1 1 auto;
  overflow-y:auto;
  padding:2px 8px 8px;
  display:flex;flex-direction:column;gap:4px;
  min-height:0;
}
.side-item{
  height:22px;flex:0 0 auto;
  padding:0 8px;
  font-size:11px;color:#000;
  display:flex;align-items:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;
  transform:translateX(6px);
  transition:opacity .4s ease, transform .4s ease;
}
.side-item.show{ opacity:1;transform:translateX(0); }

.winbody{
  padding:14px 16px 10px;
  color:var(--text);
  font-size:12px;
  line-height:1.5;
}

.track{
  height:18px;
  margin-top:10px;
  position:relative;
}
.fill{
  position:absolute;left:2px;top:2px;bottom:2px;
  width:0%;
  background-image:repeating-linear-gradient(90deg, var(--green) 0 6px, transparent 6px 8px);
  transition:width .4s linear;
}
.timeremaining{
  margin-top:6px;
  font-size:11px;
  color:#333;
  font-variant-numeric:tabular-nums;
}
.timeremaining.negative{ color:#aa0000; }

.checkrow{
  margin-top:14px;
  display:flex;align-items:center;gap:6px;
  font-size:11px;
  opacity:0;
  transition:opacity 1.2s ease;
}
.checkrow.show{opacity:1;}
.checkrow input{margin:0;width:13px;height:13px;}
.checkrow label{cursor:pointer;}

/* ---------- taskbar ---------- */
.taskbar{
  position:fixed;left:0;bottom:0;
  width:100%;
  height:32px;
  background:var(--face);
  border-top:1px solid var(--hi);
  display:flex;align-items:center;
  padding:2px 3px;
  gap:6px;
  z-index:20;
}
@keyframes taskbarFlicker{
  0%,100%{filter:none;}
  50%{filter:brightness(1.5);}
}
.taskbar.flicker{ animation:taskbarFlicker .45s ease 2; }
.startbtn{
  display:flex;align-items:center;gap:5px;
  height:24px;padding:0 8px 0 4px;
  font-size:11px;font-weight:bold;color:#000;
  cursor:pointer;
}
.flag{
  width:14px;height:14px;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  gap:1px;
}
.flag i{display:block;}
.flag i:nth-child(1){background:#f25022;}
.flag i:nth-child(2){background:#7fba00;}
.flag i:nth-child(3){background:#00a4ef;}
.flag i:nth-child(4){background:#ffb900;}

.taskbar-sep{
  flex:1;
  display:flex;align-items:center;gap:6px;
  overflow:hidden;
}
.taskbtn{
  height:24px;
  padding:0 10px;
  font-size:11px;color:#000;
  display:flex;align-items:center;
  max-width:150px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  opacity:0;
  transition:opacity .4s ease;
}
.taskbtn.show{opacity:1;}

.clock{
  height:24px;padding:0 10px;
  font-size:11px;color:#000;
  display:flex;align-items:center;
  font-variant-numeric:tabular-nums;
}
/* ---------- start menu ---------- */
.startmenu{
  position:fixed;left:2px;bottom:34px;
  width:160px;
  background:var(--face);
  border-top:2px solid var(--hi);
  border-left:2px solid var(--hi);
  border-right:2px solid var(--dk);
  border-bottom:2px solid var(--dk);
  box-shadow:2px 2px 10px rgba(0,0,0,.35);
  padding:2px;
  opacity:0;
  transform:translateY(6px);
  pointer-events:none;
  transition:opacity .18s ease, transform .18s ease;
  z-index:25;
}
.startmenu.show{ opacity:1;transform:translateY(0);pointer-events:auto; }
.startmenu-item{
  font-size:11px;color:#000;
  padding:5px 10px;
  cursor:pointer;
}
.startmenu-item:hover{ background:var(--tb1);color:#fff; }

/* ---------- snake: the loading bar itself slips its track and roams free ---------- */
.snake{
  position:fixed;inset:0 0 32px 0;
  pointer-events:none;
  z-index:15;
}
.snake-seg{
  position:absolute;
  background:var(--hi);
  background-image:repeating-linear-gradient(45deg, var(--green) 0 6px, transparent 6px 8px);
  box-shadow:0 0 0 1px var(--sh), 0 0 8px rgba(0,128,0,.5);
}

/* ---------- BSOD glimpse ---------- */
.bsod{
  position:fixed;inset:0;
  background:var(--bsod);
  color:#fff;
  font-family:var(--mono);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;
  gap:18px;
  text-align:center;
  padding:24px;
  opacity:0;
  pointer-events:none;
  z-index:50;
  transition:opacity .12s linear;
}
.bsod.show{opacity:1;transition:opacity .08s linear;}
.bsod-main{font-size:15px;max-width:640px;line-height:1.6;}
.bsod-sub{font-size:12px;opacity:.85;}

/* ---------- away alert ---------- */
.alert{
  position:fixed;
  top:14%;left:50%;
  transform:translate(-50%,-12px);
  width:min(280px,80vw);
  background:var(--face);
  border-top:2px solid var(--hi);
  border-left:2px solid var(--hi);
  border-right:2px solid var(--dk);
  border-bottom:2px solid var(--dk);
  box-shadow:4px 4px 14px rgba(0,0,0,.4);
  opacity:0;
  pointer-events:none;
  transition:opacity .35s ease, transform .35s ease;
  z-index:40;
}
.alert.show{
  opacity:1;
  transform:translate(-50%,0);
  pointer-events:auto;
}
.alert .titlebar{font-size:11px;}
.alert-body{
  padding:14px 14px 10px;
  display:flex;gap:10px;
  align-items:flex-start;
  font-size:11px;color:#000;
}
.alert-icon{font-size:20px;line-height:1;}
.alert-actions{
  display:flex;justify-content:center;
  padding:0 14px 12px;
}
.okbtn{
  font-size:11px;padding:3px 16px;
  cursor:pointer;
}
.okbtn:active{
  border-top:1px solid var(--dk);
  border-left:1px solid var(--dk);
  border-right:1px solid var(--hi);
  border-bottom:1px solid var(--hi);
}

/* ---------- notes: existential lines as their own floating windows ---------- */
.note{
  position:fixed;
  width:220px;
  background:var(--face);
  border-top:2px solid var(--hi);
  border-left:2px solid var(--hi);
  border-right:2px solid var(--dk);
  border-bottom:2px solid var(--dk);
  box-shadow:3px 3px 10px rgba(0,0,0,.35);
  opacity:0;
  transform:translateY(6px);
  transition:opacity .5s ease, transform .5s ease;
  z-index:22;
}
.note.show{ opacity:1;transform:translateY(0); }
.note .titlebar{ font-size:11px; }
.note-body{
  padding:12px 12px 6px;
  font-family:var(--ui);
  font-size:12px;
  line-height:1.5;
  color:#000;
}
.note-body::before{
  content:"» ";
  font-size:11px;
  color:#888;
  vertical-align:1px;
}
.note.deep .note-body{ font-weight:bold; }
.note-actions{
  display:flex;justify-content:center;
  padding:2px 12px 12px;
}

/* ---------- finale ---------- */
.finale-overlay{
  position:fixed;inset:0;
  background:#000;
  opacity:0;
  pointer-events:none;
  transition:opacity 2.6s ease;
  display:flex;align-items:center;justify-content:center;
  z-index:60;
  padding:16px;
}
.finale-overlay.show{opacity:1;pointer-events:auto;}
.finale{
  font-family:var(--serif);
  font-style:italic;
  font-size:22px;
  line-height:1.75;
  color:#ddd8d0;
  text-align:center;
  white-space:pre-line;
  opacity:0;
  transition:opacity 2.4s ease;
  max-width:520px;
}
.finale.show{opacity:1;}
</style>
</head>
<body>

<div class="bsod" id="bsod">
  <div class="bsod-main" id="bsodText"></div>
  <div class="bsod-sub">Press any key to continue.</div>
</div>

<div class="window" id="dialog">
  <div class="window-main">
    <div class="titlebar">
      <span>System</span>
      <div class="titlebar-btns">
        <span class="tbtn">_</span>
        <span class="tbtn">□</span>
        <span class="tbtn" id="closeBtn" role="button" tabindex="0">X</span>
      </div>
    </div>
    <div class="winbody">
      <div id="headline">Please wait.</div>
      <div class="track sunken"><div class="fill" id="fill"></div></div>
      <div class="timeremaining" id="timeRemaining">Time remaining: calculating…</div>

      <div class="checkrow" id="checkrow">
        <input type="checkbox" id="listenCheck">
        <label for="listenCheck">Enable audio feedback</label>
      </div>
    </div>
  </div>
  <div class="window-side" id="windowSide">
    <div class="window-side-head">Loading…</div>
    <div class="window-side-list" id="sideList"></div>
  </div>
</div>

<div class="alert" id="alert">
  <div class="titlebar"><span>Message</span><div class="titlebar-btns"><span class="tbtn" id="alertClose" role="button" tabindex="0">X</span></div></div>
  <div class="alert-body">
    <div class="alert-icon">⚠</div>
    <div id="alertText">you looked away.</div>
  </div>
  <div class="alert-actions"><div class="okbtn raised" id="okBtn" role="button" tabindex="0">OK</div></div>
</div>

<div class="startmenu" id="startMenu">
  <div class="startmenu-item">please wait.</div>
  <div class="startmenu-item">please wait..</div>
  <div class="startmenu-item">please wait...</div>
  <div class="startmenu-item">please wait.</div>
</div>

<div class="taskbar" id="taskbar">
  <div class="startbtn raised" id="startBtn" role="button" tabindex="0">
    <div class="flag"><i></i><i></i><i></i><i></i></div>
    Start
  </div>
  <div class="taskbar-sep" id="taskbarSep"></div>
  <div class="clock sunken" id="clock"></div>
</div>

<div class="snake" id="snake"></div>

<div class="finale-overlay" id="finaleOverlay">
  <div class="finale" id="finale"></div>
</div>

<script>
(function(){

  var headline    = document.getElementById('headline');
  var fill        = document.getElementById('fill');
  var checkrow    = document.getElementById('checkrow');
  var listenCheck = document.getElementById('listenCheck');
  var finale      = document.getElementById('finale');
  var finaleOv    = document.getElementById('finaleOverlay');
  var alertBox    = document.getElementById('alert');
  var alertText   = document.getElementById('alertText');
  var okBtn       = document.getElementById('okBtn');
  var bsod        = document.getElementById('bsod');
  var bsodText    = document.getElementById('bsodText');
  var closeBtn    = document.getElementById('closeBtn');
  var dialog      = document.getElementById('dialog');
  var taskbarSep  = document.getElementById('taskbarSep');
  var sideList    = document.getElementById('sideList');
  var clockEl     = document.getElementById('clock');
  var taskbarEl   = document.getElementById('taskbar');
  var startBtn    = document.getElementById('startBtn');
  var startMenu   = document.getElementById('startMenu');
  var timeRemainingEl = document.getElementById('timeRemaining');
  var snakeContainer = document.getElementById('snake');

  var active = 0;
  var lastTick = null;
  var visible = document.visibilityState === 'visible';
  var lookAways = 0;

  // ---------- start menu: every option is the same option ----------
  startBtn.addEventListener('click', function(e){
    e.stopPropagation();
    startMenu.classList.toggle('show');
  });
  startBtn.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); startBtn.click(); }
  });
  Array.prototype.forEach.call(startMenu.querySelectorAll('.startmenu-item'), function(item){
    item.addEventListener('click', function(){
      startMenu.classList.remove('show');
      dialog.classList.remove('shake');
      void dialog.offsetWidth;
      dialog.classList.add('shake');
      showMessage('please wait.', 2200);
    });
  });
  document.addEventListener('click', function(e){
    if(!startMenu.contains(e.target) && !startBtn.contains(e.target)){
      startMenu.classList.remove('show');
    }
  });

  function isAttending(){
    // Visibility alone — document.hasFocus() is unreliable inside a
    // sandboxed preview iframe and can sit permanently false, stalling
    // everything even though the page is plainly on screen.
    return document.visibilityState === 'visible';
  }

  // ---------- clock, real time, in a fake window ----------
  function tickClock(){
    var d = new Date();
    var h = d.getHours();
    var ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if(h === 0) h = 12;
    var m = String(d.getMinutes()).padStart(2,'0');
    clockEl.textContent = h + ':' + m + ' ' + ampm;
  }
  tickClock();
  setInterval(tickClock, 1000);

  // ---------- shared "Message" popup: away notices + the close-button denial ----------
  function dismissAlert(){
    alertBox.classList.remove('show');
  }
  function showMessage(text, holdMs){
    alertText.textContent = text;
    alertBox.classList.add('show');
    playChime();
    clearTimeout(showMessage._t);
    showMessage._t = setTimeout(dismissAlert, holdMs || 6500);
  }
  okBtn.addEventListener('click', dismissAlert);

  // ---------- close button: there is no exit ----------
  closeBtn.addEventListener('click', function(){
    dialog.classList.remove('shake');
    void dialog.offsetWidth;
    dialog.classList.add('shake');
    showMessage('This window cannot be closed.', 3000);
  });

  // ---------- look-away tracking: alert only fires on return ----------
  var awayPending = false;
  function leftPage(){ lookAways++; awayPending = true; }
  function returnedPage(){
    if(!awayPending) return;
    awayPending = false;
    var msg = lookAways >= 5 ? 'That’s fine. We were counting anyway.'
            : lookAways >= 3 ? 'You keep looking away.'
            : 'You looked away.';
    showMessage(msg, 6500);
  }
  document.getElementById('alertClose').addEventListener('click', dismissAlert);
  document.addEventListener('visibilitychange', function(){
    var now = isAttending();
    if(visible && !now){ leftPage(); }
    if(!visible && now){ returnedPage(); }
    visible = now;
  });

  // ---------- ambient sound, off by default, generated (no asset) ----------
  // Each stopSound() call closes over its OWN osc/lfo/gain/ctx locals rather
  // than the shared outer vars — otherwise a quick uncheck+recheck lets the
  // pending stop-timeout fire against the newly-started audio graph instead
  // of the one it was meant to close, killing the new sound before it plays.
  var audioCtx = null, osc = null, lfo = null, gain = null, playing = false;
  function startSound(){
    if(playing) return;
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = 96;
      lfo = audioCtx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 0.07;
      var lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 4;
      lfo.connect(lfoGain);
      lfoGain.connect(osc.frequency);
      gain = audioCtx.createGain();
      gain.gain.value = 0;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      lfo.start();
      gain.gain.linearRampToValueAtTime(0.018, audioCtx.currentTime + 3);
      playing = true;
    }catch(e){}
  }
  function stopSound(){
    if(!playing) return;
    playing = false;
    var ctxToClose = audioCtx, oscToStop = osc, lfoToStop = lfo, gainToRamp = gain;
    try{
      gainToRamp.gain.linearRampToValueAtTime(0, ctxToClose.currentTime + 1.2);
      setTimeout(function(){ try{ oscToStop.stop(); lfoToStop.stop(); ctxToClose.close(); }catch(e){} }, 1300);
    }catch(e){}
  }
  listenCheck.addEventListener('change', function(){
    listenCheck.checked ? startSound() : stopSound();
  });

  // ---------- popup chime: a small synthesized two-note "ding," not a
  // ripped system sound (that's copyrighted audio), built the same way as
  // the ambient hum above. Only plays with audio feedback enabled. ----------
  var chimeCtx = null;
  function ensureChimeCtx(){
    if(!chimeCtx){
      try{ chimeCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
    }
    return chimeCtx;
  }
  function playChime(){
    if(!listenCheck.checked) return;
    var ctx = ensureChimeCtx();
    if(!ctx) return;
    if(ctx.state === 'suspended'){ try{ ctx.resume(); }catch(e){} }
    var now = ctx.currentTime;
    [{f:988, t:0}, {f:1319, t:0.11}].forEach(function(n){
      try{
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.type = 'triangle';
        o.frequency.value = n.f;
        g.gain.setValueAtTime(0, now + n.t);
        g.gain.linearRampToValueAtTime(0.05, now + n.t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, now + n.t + 0.5);
        o.connect(g);
        g.connect(ctx.destination);
        o.start(now + n.t);
        o.stop(now + n.t + 0.55);
      }catch(e){}
    });
  }

  // role="button" spans/divs (closeBtn, alertClose, okBtn) get no free
  // Enter/Space activation the way a real <button> would — wire it up.
  [closeBtn, document.getElementById('alertClose'), okBtn].forEach(function(btn){
    btn.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); btn.click(); }
    });
  });

  // ---------- reveal timeline: a false, unreliable biography ----------
  var bsodTimer = null;
  function showBsod(text){
    bsodText.textContent = 'A fatal exception has occurred: ' + text;
    bsod.classList.add('show');
    clearTimeout(bsodTimer);
    bsodTimer = setTimeout(function(){ bsod.classList.remove('show'); }, 900);
  }
  // ---------- notes: existential lines land as their own small windows,
  // scattered anywhere on screen (free to overlap the main dialog) ----------
  var NOTE_WIDTH = 220;
  function spawnNote(text, opts){
    opts = opts || {};
    var el = document.createElement('div');
    el.className = 'note' + (opts.deep ? ' deep' : '');
    el.style.width = NOTE_WIDTH + 'px';
    el.innerHTML =
      '<div class="titlebar"><span>System</span><div class="titlebar-btns">' +
      '<span class="tbtn note-close" role="button" tabindex="0">X</span></div></div>' +
      '<div class="note-body"></div>' +
      '<div class="note-actions"><div class="okbtn raised note-ok" role="button" tabindex="0"></div></div>';
    el.querySelector('.note-body').textContent = text;
    el.querySelector('.note-ok').textContent = opts.ok || 'okay.';
    document.body.appendChild(el);

    var h = el.offsetHeight;
    var maxX = Math.max(8, window.innerWidth - NOTE_WIDTH - 8);
    var maxY = Math.max(8, window.innerHeight - 32 - h - 8);
    el.style.left = (8 + Math.random()*(maxX-8)) + 'px';
    el.style.top  = (8 + Math.random()*(maxY-8)) + 'px';
    playChime();

    requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.add('show'); }); });

    function dismiss(){
      el.classList.remove('show');
      setTimeout(function(){ el.remove(); }, 500);
    }
    var closeEl = el.querySelector('.note-close');
    closeEl.addEventListener('click', dismiss);
    closeEl.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); dismiss(); }
    });
    var okEl = el.querySelector('.note-ok');
    okEl.addEventListener('click', dismiss);
    okEl.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); dismiss(); }
    });
    setTimeout(dismiss, opts.holdMs || 11000);
  }
  function addLine(text, ok){ spawnNote(text, {ok:ok}); }
  function addLineDeep(text, ok){ spawnNote(text, {deep:true, ok:ok}); }
  function ghostWindow(){
    var el = document.createElement('div');
    el.className = 'taskbtn raised';
    el.textContent = 'System';
    taskbarSep.appendChild(el);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.add('show'); }); });
    setTimeout(function(){
      el.classList.remove('show');
      setTimeout(function(){ el.remove(); }, 500);
    }, 2400);
  }

  // ---------- taskbar: a small flicker on the first close call only ----------
  function flickerTaskbar(){
    taskbarEl.classList.remove('flicker');
    void taskbarEl.offsetWidth;
    taskbarEl.classList.add('flicker');
  }

  // ---------- the pop-up itself grows on the second close call, opening a
  // side pane where the "loading" ticks pile up; resets once the countdown
  // makes it back to zero ----------
  var windowExtended = false;
  var TICK_NAMES = ['untitled','untitled (1)','[no response]','untitled (2)','System Idle Process',
    'untitled (3)','[not responding]','untitled (4)','background task','untitled (5)','[waiting]','untitled (6)'];
  var TICK_INTERVAL = 1.5;
  var tickRunning = false;
  var tickIdx = 0;
  var tickNextAt = 0;

  function extendWindow(){
    if(windowExtended) return;
    windowExtended = true;
    dialog.classList.add('extended');
    tickRunning = true;
    tickIdx = 0;
    tickNextAt = active + 0.5;
  }
  function resetWindow(){
    dialog.classList.remove('extended');
    tickRunning = false;
    setTimeout(function(){ sideList.innerHTML = ''; }, 1300);
  }
  function feedTicks(){
    if(!tickRunning || active < tickNextAt) return;
    if(tickIdx >= TICK_NAMES.length){ tickRunning = false; return; }
    var el = document.createElement('div');
    el.className = 'side-item raised';
    el.textContent = TICK_NAMES[tickIdx++];
    sideList.appendChild(el);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.add('show'); }); });
    sideList.scrollTop = sideList.scrollHeight;
    tickNextAt = active + TICK_INTERVAL;
  }

  // ---------- second timer: counts down, goes negative, comes back to zero ----------
  var TIMER2_START = 90;
  var TIMER2_FLOOR = -45;
  var timer2On = false;
  var timer2Frozen = false;
  var timer2Value = TIMER2_START;
  var timer2Dir = -1;
  function formatTimer2(s){
    var neg = s < 0;
    var abs = Math.abs(Math.round(s));
    var m = Math.floor(abs/60);
    var sec = abs%60;
    return (neg?'-':'') + m + ':' + String(sec).padStart(2,'0');
  }
  function startTimer2(){
    timer2On = true;
    timeRemainingEl.textContent = 'Time remaining: ' + formatTimer2(timer2Value);
  }

  // ---------- snake: the loading bar slips its track and roams the open screen ----------
  var SNAKE_CELL = 10;             // worm thickness, px
  var SNAKE_SPEED = 110;           // px/sec
  var SNAKE_MAX_LENGTH = 460;      // total worm length, px — constant, like a real snake sliding
  var SNAKE_TURN_CHANCE = 0.45;    // average turns per second on the open floor
  var SNAKE_EDGE_MARGIN = 28;
  var SNAKE_ROAM_DURATION = 55;    // seconds of attended time before it fades

  var snakeRunning = false;
  var snakeStartAt = 0;
  var snakeComplete = false;
  var snakeCompleteAt = 0;
  var snakePath = [];   // {x,y} waypoints, tail..head, in viewport coordinates
  var snakeDir = {x:1,y:0};
  var snakeSegs = [];   // pooled .snake-seg elements, one per path segment

  function pickSnakeDir(exclude, x, y){
    var dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
    if(exclude){
      dirs = dirs.filter(function(d){ return !(d.x === -exclude.x && d.y === -exclude.y); });
    }
    var w = window.innerWidth, h = window.innerHeight - 32;
    var open = dirs.filter(function(d){
      if(d.x ===  1 && x > w - SNAKE_EDGE_MARGIN) return false;
      if(d.x === -1 && x < SNAKE_EDGE_MARGIN) return false;
      if(d.y ===  1 && y > h - SNAKE_EDGE_MARGIN) return false;
      if(d.y === -1 && y < SNAKE_EDGE_MARGIN) return false;
      return true;
    });
    if(open.length === 0){ open = exclude ? [{x:-exclude.x,y:-exclude.y}] : dirs; }
    return open[Math.floor(Math.random()*open.length)];
  }

  function snakePathLength(){
    var total = 0;
    for(var i=1;i<snakePath.length;i++){
      total += Math.abs(snakePath[i].x-snakePath[i-1].x) + Math.abs(snakePath[i].y-snakePath[i-1].y);
    }
    return total;
  }

  function trimSnakeTail(){
    while(snakePath.length > 2 && snakePathLength() > SNAKE_MAX_LENGTH){
      var p0 = snakePath[0], p1 = snakePath[1];
      var segLen = Math.abs(p1.x-p0.x) + Math.abs(p1.y-p0.y);
      var over = snakePathLength() - SNAKE_MAX_LENGTH;
      if(over >= segLen || segLen === 0){
        snakePath.shift();
      } else {
        var t = over/segLen;
        p0.x += (p1.x-p0.x)*t;
        p0.y += (p1.y-p0.y)*t;
        break;
      }
    }
  }

  function renderSnake(){
    var need = Math.max(0, snakePath.length-1);
    while(snakeSegs.length < need){
      var el = document.createElement('div');
      el.className = 'snake-seg';
      snakeContainer.appendChild(el);
      snakeSegs.push(el);
    }
    while(snakeSegs.length > need){
      snakeSegs.pop().remove();
    }
    for(var i=0;i<need;i++){
      var a = snakePath[i], b = snakePath[i+1], el = snakeSegs[i];
      if(a.x === b.x){
        el.style.left = (a.x - SNAKE_CELL/2)+'px';
        el.style.top = Math.min(a.y,b.y)+'px';
        el.style.width = SNAKE_CELL+'px';
        el.style.height = Math.max(Math.abs(b.y-a.y), SNAKE_CELL)+'px';
      } else {
        el.style.left = Math.min(a.x,b.x)+'px';
        el.style.top = (a.y - SNAKE_CELL/2)+'px';
        el.style.width = Math.max(Math.abs(b.x-a.x), SNAKE_CELL)+'px';
        el.style.height = SNAKE_CELL+'px';
      }
    }
  }

  function updateSnake(dt){
    var head = snakePath[snakePath.length-1];
    var w = window.innerWidth, h = window.innerHeight - 32, lookahead = 40;
    var approachingWall =
      (snakeDir.x ===  1 && head.x + lookahead > w) ||
      (snakeDir.x === -1 && head.x - lookahead < 0) ||
      (snakeDir.y ===  1 && head.y + lookahead > h) ||
      (snakeDir.y === -1 && head.y - lookahead < 0);

    if(approachingWall || Math.random() < SNAKE_TURN_CHANCE*dt){
      var newDir = pickSnakeDir(snakeDir, head.x, head.y);
      if(newDir.x !== snakeDir.x || newDir.y !== snakeDir.y){
        snakeDir = newDir;
        snakePath.push({x:head.x, y:head.y});
        head = snakePath[snakePath.length-1];
      }
    }

    head.x = Math.max(0, Math.min(w, head.x + snakeDir.x*SNAKE_SPEED*dt));
    head.y = Math.max(0, Math.min(h, head.y + snakeDir.y*SNAKE_SPEED*dt));

    trimSnakeTail();
    renderSnake();
  }

  function startSnake(){
    var trackRect = fill.getBoundingClientRect();
    var winRect = dialog.getBoundingClientRect();
    fill.style.transition = 'opacity .6s ease';
    fill.style.opacity = '0';
    // exits through the window's left edge, at the track's height, and heads
    // further left first — retreating "backward," away from completion —
    // before the usual wall-avoidance/random turns take over
    var x = winRect.left;
    var y = trackRect.top + trackRect.height/2;
    snakePath = [{x:x,y:y},{x:x,y:y}];
    snakeDir = {x:-1, y:0};
    snakeRunning = true;
    snakeStartAt = active;
  }

  function fadeSnake(){
    snakeRunning = false;
    snakeComplete = true;
    snakeCompleteAt = active;
    snakeContainer.style.transition = 'opacity 2.4s ease';
    snakeContainer.style.opacity = '0';
    setTimeout(function(){
      snakeSegs.forEach(function(el){ el.remove(); });
      snakeSegs = [];
      snakePath = [];
    }, 2500);
    addLine('it did not come back.', 'okay.');
  }

  var REVEALS = [
    { t: 5,   fn: function(){ showBsod('...nine minutes, then you left.'); } },
    { t: 20,  fn: function(){ addLine('you were here before.', 'if you say so.'); } },
    { t: 35,  fn: function(){ addLine('you stayed for eleven minutes.', 'okay.'); } },
    { t: 50,  fn: function(){ addLine('you did not finish waiting then, either.', 'noted.'); } },
    { t: 65,  fn: function(){ flickerTaskbar(); addLine('the bar is close now.', 'okay.'); } },
    { t: 75,  fn: function(){ addLine('someone was with you. we did not ask who.', 'we won’t ask now.'); } },
    { t: 90,  fn: function(){ addLine('that one might be you.', 'maybe.'); ghostWindow(); } },
    { t: 100, fn: function(){ extendWindow(); startTimer2(); addLine('the bar again. it’s making more room now.', 'okay.'); } },
    { t: 130, fn: function(){ checkrow.classList.add('show'); } },
    { t: 160, fn: function(){ addLine('there is less bar than there used to be.', 'okay.'); } },
    { t: 190, fn: function(){ addLine('you are still here.', 'still.'); } }
  ];
  var revealed = new Array(REVEALS.length).fill(false);
  var headlineSwitched = false;
  var finaleShown = false;

  // ---------- ambient lines: scripted narrative gives way to a random one ----------
  var AMBIENT_LINES = [
    'the bar is not a promise.',
    'nothing after this is scheduled.',
    'we kept the earlier version of you, too.',
    'this was supposed to end by now.',
    'the count is a courtesy.',
    'it was never eleven minutes.',
    'we made up the loading. the waiting was real.',
    'you could close this. you have not.',
    'the taskbar remembers more than the window does.',
    'somewhere it already reached zero.'
  ];
  var usedAmbient = [];
  var nextAmbientAt = 220;
  function maybeAmbient(){
    if(active < nextAmbientAt) return;
    var pool = AMBIENT_LINES.filter(function(l){ return usedAmbient.indexOf(l) === -1; });
    if(pool.length === 0){ usedAmbient = []; pool = AMBIENT_LINES; }
    var line = pool[Math.floor(Math.random()*pool.length)];
    usedAmbient.push(line);
    addLineDeep(line);
    if(Math.random() < 0.35) ghostWindow();
    if(Math.random() < 0.12) showBsod('...' + Math.floor(Math.random()*900+100) + 'ms since last response.');
    nextAmbientAt = active + 25 + Math.random()*40;
  }

  function frame(ts){
    if(lastTick === null) lastTick = ts;
    var dt = (ts - lastTick) / 1000;
    lastTick = ts;
    if(isAttending()){ active += dt; }

    if(active < 30){
      fill.style.width = Math.min(active/30,1)*100 + '%';
    } else {
      if(!headlineSwitched){
        headlineSwitched = true;
        headline.textContent = 'Please continue waiting.';
      }
      var t = active - 30;
      fill.style.width = (1 - 1/(1 + t/45)) * 100 + '%'; // asymptotic, never finishes
    }

    for(var i=0;i<REVEALS.length;i++){
      if(!revealed[i] && active > REVEALS[i].t){
        revealed[i] = true;
        REVEALS[i].fn();
      }
    }

    if(active > 190) maybeAmbient();

    if(isAttending() && timer2On && !timer2Frozen){
      timer2Value += timer2Dir * dt;
      if(timer2Dir === -1 && timer2Value <= TIMER2_FLOOR){
        timer2Value = TIMER2_FLOOR;
        timer2Dir = 1;
      } else if(timer2Dir === 1 && timer2Value >= 0){
        timer2Value = 0;
        timer2Frozen = true;
        addLine('the bar reset. we don’t know why.');
        resetWindow();
        startSnake();
      }
      timeRemainingEl.textContent = 'Time remaining: ' + formatTimer2(timer2Value);
      timeRemainingEl.classList.toggle('negative', timer2Value < 0);
    }

    if(isAttending()) feedTicks();

    if(isAttending() && snakeRunning){
      updateSnake(dt);
      if(active - snakeStartAt > SNAKE_ROAM_DURATION) fadeSnake();
    }

    var fallbackDue = active > 900;
    var arcDue = snakeComplete && active > snakeCompleteAt + 20;
    if((fallbackDue || arcDue) && !finaleShown){
      finaleShown = true;
      finaleOv.classList.add('show');
      setTimeout(function(){
        finale.textContent = 'you have been here for seven minutes.\nwe will remember eleven.\nwe may be wrong about the difference.\nwe usually are.\n\nthe bar went past zero and came back.\nthat part was real.';
        finale.classList.add('show');
      }, 1400);
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
